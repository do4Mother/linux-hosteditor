name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      PREFIX: /usr
      STAGING: ${{ github.workspace }}/staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev rpm libarchive-tools zstd

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build app and helper
        working-directory: linux/packaging
        run: make build

      - name: Stage install tree
        working-directory: linux/packaging
        run: |
          make install DESTDIR="$STAGING" PREFIX="$PREFIX"
          # Install icon referenced by the .desktop entry (Icon=hosteditor).
          install -Dm644 "$GITHUB_WORKSPACE/assets/hosteditor-logo.png" \
            "$STAGING$PREFIX/share/icons/hicolor/256x256/apps/hosteditor.png"

      - name: Install fpm
        run: |
          sudo gem install --no-document fpm

      - name: Build packages
        run: |
          mkdir -p dist
          COMMON=(
            --input-type dir
            --chdir "$STAGING"
            --name hosteditor
            --version "$VERSION"
            --license MIT
            --maintainer "HostEditor"
            --description "Manage /etc/hosts redirects"
            --url "https://github.com/${{ github.repository }}"
            --architecture native
          )

          # Debian
          fpm "${COMMON[@]}" \
            --output-type deb \
            --depends "libgtk-3-0" \
            --depends "policykit-1" \
            --package "dist/hosteditor_${VERSION}_amd64.deb" \
            .

          # RPM
          fpm "${COMMON[@]}" \
            --output-type rpm \
            --depends "gtk3" \
            --depends "polkit" \
            --package "dist/hosteditor-${VERSION}-1.x86_64.rpm" \
            .

          # Arch Linux
          fpm "${COMMON[@]}" \
            --output-type pacman \
            --depends "gtk3" \
            --depends "polkit" \
            --package "dist/hosteditor-${VERSION}-1-x86_64.pkg.tar.zst" \
            .

          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hosteditor-packages-${{ inputs.version }}
          path: dist/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            dist/* \
            --title "v${VERSION}" \
            --generate-notes \
            ${{ inputs.prerelease && '--prerelease' || '' }}
